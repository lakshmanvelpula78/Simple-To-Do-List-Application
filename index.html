<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>To-Do App</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-5">

  <h1 class="text-center mb-4">To-Do List App</h1>

  <div class="card p-4 shadow">

    <input type="text" id="title" class="form-control mb-3" placeholder="Task Title">

    <textarea id="description" class="form-control mb-3" placeholder="Task Description"></textarea>

    <button class="btn btn-success" onclick="addTask()">
      Add Task
    </button>

  </div>

  <div class="row mt-5">

    <div class="col-md-6">
      <h3>Pending Tasks</h3>
      <div id="pendingTasks"></div>
    </div>

    <div class="col-md-6">
      <h3>Completed Tasks</h3>
      <div id="completedTasks"></div>
    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
