<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
      background: linear-gradient(to right,#4facfe,#00f2fe);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .login-box{
      width:350px;
      background:white;
      padding:30px;
      border-radius:15px;
      box-shadow:0 0 15px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2 class="text-center mb-4">Login</h2>

    <input type="email" id="email" class="form-control mb-3" placeholder="Enter Email">

    <input type="password" id="password" class="form-control mb-3" placeholder="Enter Password">

    <button class="btn btn-primary w-100" onclick="login()">
      Login
    </button>
  </div>

<script>
  function login(){

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    if(email === "" || password === ""){
      alert("Please fill all fields");
    }
    else{
      alert("Login Successful");
      window.location.href = "index.html";
    }
  }
</script>

</body>
</html>
